[package]
authors = ["Jonas Platte <jplatte+git@posteo.de>"]
license = "AGPL-3.0+"
name = "turbofish"
repository = "https://codeberg.org/jplatte/turbo.fish"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
minijinja = "2.19"
percent-encoding = "2.3"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
serde = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
